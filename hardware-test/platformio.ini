[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32 @ 6.4.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    nrf24/RF24 @ 1.4.11
    miguelbalboa/MFRC522 @ 1.4.11
    crankyoldgit/IRremoteESP8266 @ 2.8.6

[env:radio]
platform = espressif32 @ 6.4.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<../radio/main.cpp>
lib_deps = nrf24/RF24 @ 1.4.11

[env:single-nrf]
platform = espressif32 @ 6.4.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<../single-nrf/main.cpp>
lib_deps = nrf24/RF24 @ 1.4.11

[env:link]
platform = espressif32 @ 6.4.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<../link/main.cpp>
lib_deps = nrf24/RF24 @ 1.4.11

[env:receiver]
platform = espressif32 @ 6.4.0
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter = -<*> +<../receiver/main.cpp>
lib_deps = nrf24/RF24 @ 1.4.11
